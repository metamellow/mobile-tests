<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOAT Casino Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .connection-status {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .connected {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4caf50;
            color: #4caf50;
        }

        .disconnected {
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid #f44336;
            color: #f44336;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid #f44336;
            color: #f44336;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .admin-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .admin-section h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4caf50, #45a049);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-warning {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }

        .btn-success {
            background: linear-gradient(45deg, #2196f3, #1976d2);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        .result {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border-left: 4px solid #ffd700;
        }

        .pool-health-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .pool-health-table th,
        .pool-health-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pool-health-table th {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            font-weight: bold;
        }

        .pool-health-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .utilization-bar {
            width: 200px;
            height: 20px;
            background: #e65100;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .utilization-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .utilization-text {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛️ GOAT Casino Admin Dashboard</h1>
            <p>Owner-only administrative controls for GOAT Casino operations</p>
        </div>

        <!-- Connection Status -->
        <div id="connectionStatus" class="connection-status disconnected">
            <div id="connectionText">🔴 Not Connected</div>
            <div id="walletAddress" class="hidden"></div>
        </div>

        <!-- Error Display -->
        <div id="errorDisplay" class="error hidden"></div>

        <!-- Connect Button -->
        <div class="admin-section">
            <h2>🔗 Wallet Connection</h2>
            <button id="connectBtn" class="btn btn-primary">Connect Wallet</button>
        </div>

        <!-- Pause Controls -->
        <div class="admin-section">
            <h2>⏸️ Pause Controls</h2>
            <div class="button-group">
                <button id="checkPauseStatusBtn" class="btn btn-primary" disabled>Check Current Pause Status</button>
                <button id="softPauseBtn" class="btn btn-warning" disabled>Soft Pause</button>
                <button id="hardPauseBtn" class="btn btn-danger" disabled>Hard Pause</button>
                <button id="unpauseAllBtn" class="btn btn-success" disabled>Unpause All</button>
            </div>
            <div id="pauseStatus" class="result hidden"></div>
        </div>

        <!-- Staking Status -->
        <div class="admin-section">
            <h2>📊 Check Global Staking Status</h2>
            <div class="button-group">
                <button id="checkStakingBtn" class="btn btn-primary" disabled>Check Global Staking Status</button>
            </div>
            <div id="stakingStatus" class="result hidden"></div>
        </div>

        <!-- Pool Health -->
        <div class="admin-section">
            <h2>🏥 Check Pool Health</h2>
            <div class="button-group">
                <button id="checkPoolHealthBtn" class="btn btn-primary" disabled>Check Pool Health</button>
            </div>
            <div id="poolHealthStatus" class="result hidden"></div>
            <div id="poolHealthTable" class="hidden"></div>
        </div>
    </div>

    <!-- Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <script>
        // ================= CONFIGURATION =================
        // IMPORTANT: Update these addresses to match your deployed contracts on Avalanche mainnet
        const OWNER_ADDRESS = "0x40a38bf9CCf14d8728229fBD60413C2AE0CbD49a"; // Contract owner address
        const HOUSE_ADDRESS = "0xe14eC1e15a9E4B2cb2ECEBCBA50C237698623139"; // House contract address
        
        // Mainnet tokens
        const TOKENS = [
            { symbol: 'AVAX', address: '0x0000000000000000000000000000000000000000', name: 'Avalanche' },
            { symbol: 'NOCHILL', address: '0xAcFb898Cff266E53278cC0124fC2C7C94C8cB9a5', name: 'NOCHILL' },
            { symbol: 'LAMBO', address: '0x6F43fF77A9C0Cf552b5b653268fBFe26A052429b', name: 'LAMBO' },
            { symbol: 'PNG', address: '0x60781C2586D68229fde47564546784ab3fACA982', name: 'PNG' },
            { symbol: 'BRIDGE', address: '0xa75a61051D5746Ec32B8e2BB6A38028bC266fC7A', name: 'BRIDGE' },
            { symbol: 'ADOPT', address: '0x2211805130B8a6D3FF560530048ac120812F89F6', name: 'ADOPT' },
            { symbol: 'FINANCE', address: '0xac6e53f1e1ebafda8553c0add8c5b32bcb5890c4', name: 'FINANCE' },
            { symbol: 'GOAT', address: '0xB9C188BC558a82a1eE9E75AE0857df443F407632', name: 'GOAT' },
            { symbol: 'ID', address: '0x34a528Da3b2EA5c6Ad1796Eba756445D1299a577', name: 'ID' },
            { symbol: 'PBP', address: '0x5B9Dd6851088dC5b2ACF8AE9552461D64B2B092F', name: 'PBP' },
            { symbol: 'PHARM', address: '0x91a1C5a6001e6Aa628f49094658C65A19794D7f6', name: 'PHARM' },
            { symbol: 'FUEL', address: '0x29Fbb1569364ac8CC48851Bd5E144faa2a78f528', name: 'FUEL' }
        ];

        // Total funded amounts (in wei)
        const TOTAL_FUNDED_AMOUNTS = {
            'AVAX': ethers.utils.parseEther('130'),
            'NOCHILL': ethers.utils.parseEther('1200000'),
            'PNG': ethers.utils.parseEther('42000'),
            'BRIDGE': ethers.utils.parseEther('150000000'),
            'FINANCE': ethers.utils.parseEther('50000000'),
            'GOAT': ethers.utils.parseEther('155000000'),
            'ID': ethers.utils.parseEther('4000000'),
            'PBP': ethers.utils.parseEther('313261934'),
            'PHARM': ethers.utils.parseEther('35000000'),
            'FUEL': ethers.utils.parseEther('500000000'),
            'ADOPT': ethers.utils.parseEther('500000000'),
            'LAMBO': ethers.utils.parseEther('5000000')
        };

        // House ABI (minimal for admin functions)
        const HOUSE_ABI = [
            "function owner() view returns (address)",
            "function setPause(bool hard, bool soft)",
            "function hardPaused() view returns (bool)",
            "function softPaused() view returns (bool)",
            "function totalStakedGOAT() view returns (uint256)",
            "function playerPools(address) view returns (uint256)",
            "function stakerPools(address) view returns (uint256)",
            "function minBet(address) view returns (uint256)",
            "function feeBps(address) view returns (uint256)",
            "function stakerPoolPercentBps(address) view returns (uint256)"
        ];

        // ================= GLOBAL VARIABLES =================
        let provider, signer, houseContract, userAddress;

        // ================= UTILITY FUNCTIONS =================
        function showError(message) {
            const errorDiv = document.getElementById('errorDisplay');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        function showSuccess(message, elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div style="color: #4caf50;">✅ ${message}</div>`;
            element.classList.remove('hidden');
        }

        function showLoading(elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = '<div class="loading"></div> Processing...';
            element.classList.remove('hidden');
        }

        function formatEther(value) {
            if (!value) return '0';
            const num = parseFloat(ethers.utils.formatEther(value));
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            } else if (num >= 1) {
                return num.toFixed(2);
            } else {
                return num.toFixed(4);
            }
        }

        function updateConnectionStatus(connected, address = '') {
            const statusDiv = document.getElementById('connectionStatus');
            const textDiv = document.getElementById('connectionText');
            const addressDiv = document.getElementById('walletAddress');
            
            if (connected) {
                statusDiv.className = 'connection-status connected';
                textDiv.textContent = '🟢 Connected';
                addressDiv.textContent = `Address: ${address}`;
                addressDiv.classList.remove('hidden');
            } else {
                statusDiv.className = 'connection-status disconnected';
                textDiv.textContent = '🔴 Not Connected';
                addressDiv.classList.add('hidden');
            }
        }

        function enableAdminButtons(enable) {
            const buttons = [
                'checkPauseStatusBtn', 'softPauseBtn', 'hardPauseBtn', 'unpauseAllBtn',
                'checkStakingBtn', 'checkPoolHealthBtn'
            ];
            
            buttons.forEach(id => {
                document.getElementById(id).disabled = !enable;
            });
        }

        // ================= CONNECTION FUNCTIONS =================
        async function connectWallet() {
            try {
                if (!window.ethereum) {
                    showError('MetaMask not found! Please install MetaMask extension.');
                    return;
                }

                // Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (!accounts || accounts.length === 0) {
                    showError('No accounts found. Please unlock MetaMask.');
                    return;
                }

                userAddress = accounts[0];
                
                // Check if connected to Avalanche mainnet
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== '0xa86a') { // Avalanche mainnet chain ID
                    showError('Please switch to Avalanche mainnet in MetaMask.');
                    return;
                }

                // Check if user is the owner
                if (userAddress.toLowerCase() !== OWNER_ADDRESS.toLowerCase()) {
                    showError('Access denied. Only the contract owner can use this dashboard.');
                    updateConnectionStatus(false);
                    return;
                }

                // Setup provider and contracts
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                houseContract = new ethers.Contract(HOUSE_ADDRESS, HOUSE_ABI, signer);

                // Test contract connection by calling a simple view function
                try {
                    const contractOwner = await houseContract.owner();
                    if (contractOwner.toLowerCase() !== userAddress.toLowerCase()) {
                        showError('Access denied. You are not the contract owner.');
                        updateConnectionStatus(false);
                        return;
                    }
                } catch (error) {
                    if (error.code === 'CALL_EXCEPTION') {
                        showError(`Contract not found at address ${HOUSE_ADDRESS}. Please verify the contract address is correct and deployed on Avalanche mainnet.`);
                    } else {
                        showError(`Contract connection failed: ${error.message}`);
                    }
                    updateConnectionStatus(false);
                    return;
                }

                updateConnectionStatus(true, userAddress);
                enableAdminButtons(true);
                // Don't call showSuccess here as it conflicts with updateConnectionStatus

            } catch (error) {
                console.error('Connection error:', error);
                showError(`Connection failed: ${error.message}`);
                updateConnectionStatus(false);
            }
        }

        // ================= PAUSE CONTROLS =================
        async function checkPauseStatus() {
            try {
                showLoading('pauseStatus');
                
                const hardPaused = await houseContract.hardPaused();
                const softPaused = await houseContract.softPaused();
                
                let statusText = '';
                if (hardPaused) {
                    statusText = '<span style="color:#f44336;">🔴 HARD PAUSED</span> - All operations blocked';
                } else if (softPaused) {
                    statusText = '<span style="color:#ff9800;">🟡 SOFT PAUSED</span> - New games blocked, withdrawals allowed';
                } else {
                    statusText = '<span style="color:#4caf50;">🟢 RUNNING</span> - All operations allowed';
                }
                
                document.getElementById('pauseStatus').innerHTML = statusText;
                document.getElementById('pauseStatus').classList.remove('hidden');
            } catch (error) {
                console.error('Pause status error:', error);
                showError(`Failed to check pause status: ${error.message}`);
            }
        }

        async function setPause(hard, soft) {
            try {
                showLoading('pauseStatus');
                const tx = await houseContract.setPause(hard, soft);
                await tx.wait();
                
                const action = hard ? 'Hard pause' : (soft ? 'Soft pause' : 'Unpause');
                showSuccess(`${action} successful!`, 'pauseStatus');
                
                // Refresh pause status after setting
                setTimeout(checkPauseStatus, 1000);
            } catch (error) {
                console.error('Pause error:', error);
                showError(`Pause operation failed: ${error.message}`);
            }
        }

        // ================= STAKING STATUS =================
        async function checkStakingStatus() {
            try {
                showLoading('stakingStatus');
                
                const totalStaked = await houseContract.totalStakedGOAT();
                
                const status = `
                    <div style="color: #fff;">
                        <h3>📊 Global Staking Status</h3>
                        <div style="margin: 10px 0;">
                            <strong>Total Staked GOAT:</strong> ${formatEther(totalStaked)}
                        </div>
                    </div>
                `;
                
                document.getElementById('stakingStatus').innerHTML = status;
                document.getElementById('stakingStatus').classList.remove('hidden');
            } catch (error) {
                console.error('Staking status error:', error);
                showError(`Failed to get staking status: ${error.message}`);
            }
        }

        // ================= POOL HEALTH =================
        async function checkPoolHealth() {
            try {
                showLoading('poolHealthStatus');
                
                const poolData = [];
                
                // Check each token's pool balances and configuration
                for (const token of TOKENS) {
                    try {
                        const playerPoolBalance = await houseContract.playerPools(token.address);
                        const stakerPoolBalance = await houseContract.stakerPools(token.address);
                        const minBet = await houseContract.minBet(token.address);
                        const feeBps = await houseContract.feeBps(token.address);
                        const stakerPoolPercentBps = await houseContract.stakerPoolPercentBps(token.address);
                        
                        const playerPoolNum = parseFloat(ethers.utils.formatEther(playerPoolBalance));
                        const stakerPoolNum = parseFloat(ethers.utils.formatEther(stakerPoolBalance));
                        const totalFunded = TOTAL_FUNDED_AMOUNTS[token.symbol] || ethers.constants.Zero;
                        const totalFundedNum = parseFloat(ethers.utils.formatEther(totalFunded));
                        
                        // Calculate utilization percentage based on PLAYER POOL ONLY
                        const utilizationPercent = totalFundedNum > 0 ? (playerPoolNum / totalFundedNum * 100) : 0;
                        
                        poolData.push({
                            symbol: token.symbol,
                            totalFunded: formatEther(totalFunded),
                            currentPool: formatEther(ethers.utils.parseEther((playerPoolNum + stakerPoolNum).toString())),
                            playerPool: formatEther(playerPoolBalance),
                            stakerPool: formatEther(stakerPoolBalance),
                            minBet: formatEther(minBet),
                            feePercent: (feeBps / 100).toFixed(2),
                            stakerPoolPercent: (stakerPoolPercentBps / 100).toFixed(2),
                            utilizationPercent: utilizationPercent
                        });
                        
                    } catch (e) {
                        console.warn(`Failed to get pool data for ${token.symbol}:`, e);
                    }
                }
                
                // Generate table
                const table = generatePoolHealthTable(poolData);
                document.getElementById('poolHealthTable').innerHTML = table;
                document.getElementById('poolHealthTable').classList.remove('hidden');
                
                showSuccess(`Pool health check completed for ${poolData.length} tokens`, 'poolHealthStatus');
                
            } catch (error) {
                console.error('Pool health error:', error);
                showError(`Failed to check pool health: ${error.message}`);
            }
        }

        function generatePoolHealthTable(poolData) {
            // Sort by utilization percentage (descending)
            const sortedData = poolData.sort((a, b) => b.utilizationPercent - a.utilizationPercent);
            
            let html = `
                <table class="pool-health-table">
                    <thead>
                        <tr>
                            <th>Token</th>
                            <th>Total Funded</th>
                            <th>Current Pool</th>
                            <th>Player Pool</th>
                            <th>Staker Pool</th>
                            <th>Pool Utilization</th>
                            <th>Min Bet</th>
                            <th>Dev Fee</th>
                            <th>Staker %</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            sortedData.forEach(token => {
                // Color coding for utilization
                let barColor = '#9c27b0'; // Purple for base funded amount
                if (token.utilizationPercent > 100) {
                    barColor = '#4caf50'; // Green if over 100% of funded amount
                } else if (token.utilizationPercent < 50) {
                    barColor = '#f44336'; // Red for low utilization
                } else if (token.utilizationPercent < 80) {
                    barColor = '#ff9800'; // Orange for medium utilization
                }
                
                html += `
                    <tr>
                        <td><strong>${token.symbol}</strong></td>
                        <td style="color: #9c27b0;">${token.totalFunded}</td>
                        <td style="color: #ff9800; font-weight: bold;">${token.currentPool}</td>
                        <td style="color: #4caf50;">${token.playerPool}</td>
                        <td style="color: #2196f3;">${token.stakerPool}</td>
                        <td>
                            <div class="utilization-bar">
                                <div class="utilization-fill" style="width: ${Math.min(token.utilizationPercent, 100)}%; background: ${barColor};"></div>
                                <div class="utilization-text">${token.utilizationPercent.toFixed(1)}%</div>
                            </div>
                        </td>
                        <td style="color: #8b0000;">${token.minBet}</td>
                        <td style="color: #8b0000;">${token.feePercent}%</td>
                        <td style="color: #8b0000;">${token.stakerPoolPercent}%</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
                <div style="margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                    <h4 style="color: #ffd700; margin-bottom: 10px;">Pool Health Legend:</h4>
                    <div style="font-size: 0.9em; line-height: 1.6;">
                        <div><span style="color: #4caf50;">■ Green (100%+):</span> Player pool exceeds funded amount (excellent)</div>
                        <div><span style="color: #9c27b0;">■ Purple (80-100%):</span> Good player pool utilization</div>
                        <div><span style="color: #ff9800;">■ Orange (50-80%):</span> Moderate player pool utilization</div>
                        <div><span style="color: #f44336;">■ Red (<50%):</span> Low player pool utilization - may need attention</div>
                        <div style="margin-top: 10px; color: #ccc; font-size: 0.8em;">Note: Utilization is based on PLAYER POOL only (staker pool excluded as it can be claimed)</div>
                    </div>
                </div>
            `;
            
            return html;
        }

        // ================= EVENT LISTENERS =================
        document.getElementById('connectBtn').addEventListener('click', connectWallet);
        document.getElementById('checkPauseStatusBtn').addEventListener('click', checkPauseStatus);
        document.getElementById('softPauseBtn').addEventListener('click', () => setPause(false, true));
        document.getElementById('hardPauseBtn').addEventListener('click', () => setPause(true, false));
        document.getElementById('unpauseAllBtn').addEventListener('click', () => setPause(false, false));
        document.getElementById('checkStakingBtn').addEventListener('click', checkStakingStatus);
        document.getElementById('checkPoolHealthBtn').addEventListener('click', checkPoolHealth);

        // Listen for account changes
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    updateConnectionStatus(false);
                    enableAdminButtons(false);
                } else {
                    connectWallet(); // Reconnect with new account
                }
            });

            window.ethereum.on('chainChanged', () => {
                updateConnectionStatus(false);
                enableAdminButtons(false);
                showError('Network changed. Please reconnect.');
            });
        }

        // Initialize
        updateConnectionStatus(false);
        enableAdminButtons(false);
    </script>
</body>
</html>
