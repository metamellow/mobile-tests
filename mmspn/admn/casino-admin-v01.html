<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memespin Casino Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
    <style>
        /* ================= CONFIG VARIABLES - EDIT THESE ================= */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --card-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.2);
            --text-primary: #fff;
            --text-secondary: #e0e0e0;
            --accent-1: #667eea;
            --accent-2: #764ba2;
            --success: #56ab2f;
            --danger: #ff416c;
            --warning: #f093fb;
            --info: #45b7d1;
        }

        /* ================= GLOBAL STYLES ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary), var(--bg-tertiary));
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(45deg, var(--accent-1), var(--accent-2));
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success { background: linear-gradient(45deg, var(--success), #a8e6cf); }
        .btn-danger { background: linear-gradient(45deg, var(--danger), #ff4b2b); }
        .btn-warning { background: linear-gradient(45deg, var(--warning), #f5576c); }
        .btn-info { background: linear-gradient(45deg, var(--info), #764ba2); }

        .section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        .section h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--info);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section h3 {
            font-size: 1.2rem;
            margin: 15px 0 10px 0;
            color: var(--accent-1);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 14px;
        }

        .input-group small {
            color: var(--text-secondary);
            font-size: 12px;
            display: block;
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h4 {
            color: var(--info);
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .stat-card .value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .result-display {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .result-display.success { border-left: 4px solid var(--success); }
        .result-display.error { border-left: 4px solid var(--danger); }
        .result-display.info { border-left: 4px solid var(--info); }

        .hidden { display: none; }

        .error-message {
            color: var(--danger);
            background: rgba(255, 65, 108, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid rgba(255, 65, 108, 0.3);
        }

        .success-message {
            color: var(--success);
            background: rgba(86, 171, 47, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid rgba(86, 171, 47, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎰 Memespin Casino Admin Panel</h1>
            <p>Administrative interface for managing the casino ecosystem</p>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="wallet-info">
                <span id="wallet-status">Not Connected</span>
                <span id="wallet-address" class="hidden"></span>
            </div>
            <button class="btn" id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Main Content (hidden until wallet connected) -->
        <div id="main-content" class="hidden">
            <!-- Statistics Section -->
            <div class="section" id="stats-section">
                <h2>📊 Statistics</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Points Section -->
            <div class="section" id="points-section">
                <h2>🏆 Points Viewer</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Admin Functions Section -->
            <div class="section" id="admin-section">
                <h2>⚙️ Admin Functions</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Staking Data Section -->
            <div class="section" id="staking-section">
                <h2>🪙 Staking Data</h2>
                <!-- Content will be added by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        /* ================= CONFIGURATION VARIABLES - EDIT THESE ================= */
        // Contract addresses - UPDATE THESE FROM casino-deployment-info.json
        const CONFIG = {
            // Network Configuration
            TEN_RPC_URL: 'https://testnet-rpc.ten.xyz/v1/?token=34F99D7ACF7B6940A0381D89DFF468600515D531',
            
            // Contract Addresses
            CONTRACT_ADDRESSES: {
                DevToken: "0x38348ff7f09705ADA54d0979b607003B7616A44F",
                House: "0x9CC5805A71571f3306b7357546566Ef4CbF78F1C",
                Plinko: "0x3aa56C1D3835B536573646cF63829257236D54A9",
                Roulette: "0x40FC3A1BfEE63652c6749A505f54Bfc3e1293778",
                Slots: "0x1AdD159DC347b94252d134655eA94e0d63Cc086e",
                wTENX: "0x10107E1160026A0311a4Be3C0d39b96BCf851010"
            },
            
            // Starting Pool Amounts (for calculating growth/loss)
            // These can be edited in browser for temporary changes
            STARTING_POOL_AMOUNTS: {
                ETH: "2.0",          // Starting ETH player pool amount
                wTENX: "10000.0"     // Starting wTENX player pool amount
            },
            
            // ABI File Paths (relative to this HTML file)
            ABI_FILES: [
                'abis/DevToken.json',
                'abis/House.json',
                'abis/Plinko.json',
                'abis/Roulette.json',
                'abis/Slots.json',
                'abis/wTENToken.json'
            ]
        };

        /* ================= GLOBAL STATE ================= */
        let provider = null;
        let signer = null;
        let account = null;
        let contracts = {};
        let abis = {};
        let readOnlyProvider = null;

        /* ================= INITIALIZATION ================= */
        async function init() {
            try {
                showLoading(true);
                
                // Load ABIs
                await loadABIs();
                
                // Initialize read-only provider and contracts for viewing data
                readOnlyProvider = new ethers.JsonRpcProvider(CONFIG.TEN_RPC_URL);
                
                // Initialize read-only contracts (for viewing data without wallet)
                contracts.House = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.House, abis.House, readOnlyProvider);
                contracts.DevToken = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.DevToken, abis.DevToken, readOnlyProvider);
                contracts.Plinko = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Plinko, abis.Plinko, readOnlyProvider);
                contracts.Roulette = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Roulette, abis.Roulette, readOnlyProvider);
                contracts.Slots = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Slots, abis.Slots, readOnlyProvider);
                
                // Show main content immediately (for read-only viewing)
                document.getElementById('main-content').classList.remove('hidden');
                
                // Initialize sections (read-only mode)
                await initAllSections();
                
                showLoading(false);
                
                console.log('✅ Admin panel initialized (read-only mode)');
            } catch (error) {
                console.error('❌ Initialization failed:', error);
                showError('Failed to initialize admin panel: ' + error.message);
                showLoading(false);
            }
        }

        /* ================= ABI LOADING ================= */
        async function loadABIs() {
            for (const file of CONFIG.ABI_FILES) {
                try {
                    const response = await fetch(file);
                    const abi = await response.json();
                    const contractName = file.split('/')[1].replace('.json', '');
                    abis[contractName] = abi;
                    console.log(`✅ Loaded ABI: ${contractName}`);
                } catch (error) {
                    console.error(`❌ Failed to load ABI: ${file}`, error);
                }
            }
        }

        /* ================= WALLET CONNECTION ================= */
        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    showError('MetaMask or compatible wallet not found. Please install MetaMask.');
                    return;
                }

                // Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];

                // Create provider and signer
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();

                // Upgrade contracts to writable (with signer)
                contracts.House = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.House, abis.House, signer);
                contracts.DevToken = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.DevToken, abis.DevToken, signer);
                contracts.Plinko = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Plinko, abis.Plinko, signer);
                contracts.Roulette = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Roulette, abis.Roulette, signer);
                contracts.Slots = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Slots, abis.Slots, signer);

                // Verify ownership
                try {
                    const owner = await contracts.House.owner();
                    if (owner.toLowerCase() !== account.toLowerCase()) {
                        showError('⚠️  Warning: You are not the owner of the House contract. Some functions may fail.');
                    }
                } catch (error) {
                    console.warn('Could not verify ownership:', error);
                }

                // Update UI
                document.getElementById('wallet-status').textContent = 'Connected';
                document.getElementById('wallet-address').textContent = account;
                document.getElementById('wallet-address').classList.remove('hidden');
                document.getElementById('connect-btn').textContent = 'Connected';
                document.getElementById('connect-btn').disabled = true;

                // Refresh data with writable contracts
                await refreshStats();
                await refreshStaking();

                console.log('✅ Wallet connected:', account);
            } catch (error) {
                console.error('❌ Wallet connection failed:', error);
                showError('Failed to connect wallet: ' + error.message);
            }
        }

        /* ================= WALLET CHECK HELPER ================= */
        function requireWallet() {
            if (!signer || !account) {
                showError('⚠️  Please connect your wallet to perform this action.');
                return false;
            }
            return true;
        }

        /* ================= SECTION INITIALIZATION ================= */
        async function initAllSections() {
            try {
                await initStatsSection();
                await initPointsSection();
                await initAdminSection();
                await initStakingSection();
            } catch (error) {
                console.error('❌ Section initialization failed:', error);
                showError('Failed to initialize sections: ' + error.message);
            }
        }

        /* ================= STATISTICS SECTION ================= */
        async function initStatsSection() {
            const section = document.getElementById('stats-section');
            section.innerHTML = `
                <h3>🎮 Games Played</h3>
                <div class="stats-grid" id="games-stats"></div>
                
                <h3>💰 Pool Amounts</h3>
                <div class="input-group">
                    <label>Starting Pool Amounts (for growth calculation)</label>
                    <div class="two-column">
                        <input type="text" id="starting-eth-pool" value="${CONFIG.STARTING_POOL_AMOUNTS.ETH}" placeholder="Starting ETH">
                        <input type="text" id="starting-wtenx-pool" value="${CONFIG.STARTING_POOL_AMOUNTS.wTENX}" placeholder="Starting wTENX">
                    </div>
                    <small>Edit these values to recalculate growth. Changes are temporary (session only).</small>
                </div>
                <div class="stats-grid" id="pool-stats"></div>
                
                <h3>💸 Dev Fees Collected</h3>
                <div class="stats-grid" id="dev-fees-stats"></div>
                
                <button class="btn btn-info" onclick="refreshStats()">🔄 Refresh Statistics</button>
                <div id="stats-result" class="result-display hidden"></div>
            `;
            await refreshStats();
        }

        async function refreshStats() {
            try {
                showResult('stats-result', 'info', 'Loading statistics...');
                document.getElementById('stats-result').classList.remove('hidden');

                // Games played
                const slotsGames = await contracts.Slots.nextGameId();
                const plinkoGames = await contracts.Plinko.nextGameId();
                const rouletteGames = await contracts.Roulette.nextGameId();
                
                document.getElementById('games-stats').innerHTML = `
                    <div class="stat-card">
                        <h4>Slots Games</h4>
                        <div class="value">${(slotsGames - 1n).toString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Plinko Games</h4>
                        <div class="value">${(plinkoGames - 1n).toString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Roulette Games</h4>
                        <div class="value">${(rouletteGames - 1n).toString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Total Games</h4>
                        <div class="value">${(slotsGames + plinkoGames + rouletteGames - 3n).toString()}</div>
                    </div>
                `;

                // Pool amounts
                const ethPlayerPool = await contracts.House.playerPools(ethers.ZeroAddress);
                const ethStakerPool = await contracts.House.stakerPools(ethers.ZeroAddress);
                const wtenxPlayerPool = await contracts.House.playerPools(CONFIG.CONTRACT_ADDRESSES.wTENX);
                const wtenxStakerPool = await contracts.House.stakerPools(CONFIG.CONTRACT_ADDRESSES.wTENX);

                const startingEthWei = ethers.parseEther(String(CONFIG.STARTING_POOL_AMOUNTS.ETH || '0'));
                const startingWTENXWei = ethers.parseEther(String(CONFIG.STARTING_POOL_AMOUNTS.wTENX || '0'));
                const ethGrowthWei = (BigInt(ethPlayerPool)) - (BigInt(startingEthWei));
                const wtenxGrowthWei = (BigInt(wtenxPlayerPool)) - (BigInt(startingWTENXWei));

                document.getElementById('pool-stats').innerHTML = `
                    <div class="stat-card">
                        <h4>ETH Player Pool</h4>
                        <div class="value">${formatEther5(ethPlayerPool)} ETH</div>
                        <small>${formatEther5Signed(ethGrowthWei)} ETH</small>
                    </div>
                    <div class="stat-card">
                        <h4>ETH Staker Pool</h4>
                        <div class="value">${formatEther5(ethStakerPool)} ETH</div>
                    </div>
                    <div class="stat-card">
                        <h4>wTENX Player Pool</h4>
                        <div class="value">${formatEther5(wtenxPlayerPool)} wTENX</div>
                        <small>${formatEther5Signed(wtenxGrowthWei)} wTENX</small>
                    </div>
                    <div class="stat-card">
                        <h4>wTENX Staker Pool</h4>
                        <div class="value">${formatEther5(wtenxStakerPool)} wTENX</div>
                    </div>
                `;

                // Dev fees
                const ethDevFees = await contracts.House.devFeesCollected(ethers.ZeroAddress);
                const wtenxDevFees = await contracts.House.devFeesCollected(CONFIG.CONTRACT_ADDRESSES.wTENX);

                document.getElementById('dev-fees-stats').innerHTML = `
                    <div class="stat-card">
                        <h4>ETH Dev Fees</h4>
                        <div class="value">${formatEther5(ethDevFees)} ETH</div>
                    </div>
                    <div class="stat-card">
                        <h4>wTENX Dev Fees</h4>
                        <div class="value">${formatEther5(wtenxDevFees)} wTENX</div>
                    </div>
                `;

                // Update config from inputs (if changed)
                const startingEthInput = document.getElementById('starting-eth-pool').value;
                const startingWTENXInput = document.getElementById('starting-wtenx-pool').value;
                CONFIG.STARTING_POOL_AMOUNTS.ETH = startingEthInput;
                CONFIG.STARTING_POOL_AMOUNTS.wTENX = startingWTENXInput;

                showResult('stats-result', 'success', 'Statistics refreshed successfully!');
            } catch (error) {
                console.error('❌ Failed to refresh stats:', error);
                showResult('stats-result', 'error', 'Error: ' + error.message);
            }
        }

        /* ================= POINTS SECTION ================= */
        async function initPointsSection() {
            const section = document.getElementById('points-section');
            section.innerHTML = `
                <div class="input-group">
                    <label>Wallet Address</label>
                    <input type="text" id="points-wallet" placeholder="0x..." value="${account || ''}">
                </div>
                <div class="input-group">
                    <label>Token</label>
                    <select id="points-token">
                        <option value="ETH">ETH</option>
                        <option value="wTENX">wTENX</option>
                    </select>
                </div>
                <button class="btn btn-info" onclick="checkUserPoints()">🔍 Check Points</button>
                <div id="points-result" class="result-display hidden"></div>
            `;
        }

        async function checkUserPoints() {
            try {
                const walletAddress = document.getElementById('points-wallet').value;
                const tokenSelect = document.getElementById('points-token').value;

                if (!walletAddress) {
                    showResult('points-result', 'error', 'Please enter a wallet address');
                    document.getElementById('points-result').classList.remove('hidden');
                    return;
                }

                const tokenAddress = tokenSelect === 'ETH' ? ethers.ZeroAddress : CONFIG.CONTRACT_ADDRESSES.wTENX;
                
                showResult('points-result', 'info', `Checking points for ${walletAddress}...`);
                document.getElementById('points-result').classList.remove('hidden');

                const points = await contracts.House.getUserPoints(walletAddress, tokenAddress);
                
                showResult('points-result', 'success', `${tokenSelect} Points: ${points.toString()}`);
            } catch (error) {
                console.error('❌ Failed to check points:', error);
                showResult('points-result', 'error', 'Error: ' + error.message);
            }
        }

        /* ================= ADMIN SECTION ================= */
        async function initAdminSection() {
            const section = document.getElementById('admin-section');
            section.innerHTML = `
                <div class="two-column">
                    <!-- Token Management -->
                    <div>
                        <h3>🪙 Token Management</h3>
                        <div class="input-group">
                            <label>Whitelist New Token</label>
                            <input type="text" id="whitelist-token-address" placeholder="Token address">
                            <input type="number" id="whitelist-token-decimals" placeholder="Decimals (18)" value="18">
                            <input type="text" id="whitelist-token-minbet" placeholder="Min bet (e.g., 1.0)">
                            <button class="btn btn-success" onclick="whitelistToken()">Whitelist Token</button>
                        </div>
                        <div class="input-group">
                            <label>Set Token Config</label>
                            <select id="config-token-select">
                                <option value="ETH">ETH</option>
                                <option value="wTENX">wTENX</option>
                            </select>
                            <input type="text" id="config-fee-bps" placeholder="Fee (bps, e.g., 100 = 1%)">
                            <input type="text" id="config-staker-percent-bps" placeholder="Staker % (bps, e.g., 1000 = 10%)">
                            <input type="text" id="config-min-bet" placeholder="Min bet">
                            <input type="text" id="config-max-payout-percent-bps" placeholder="Max payout % (bps, e.g., 8000 = 80%)">
                            <button class="btn btn-success" onclick="setTokenConfig()">Set Config</button>
                        </div>
                    </div>
                    
                    <!-- Game Management -->
                    <div>
                        <h3>🎮 Game Management</h3>
                        <div class="input-group">
                            <label>Authorize/Deauthorize Game</label>
                            <select id="authorize-game-select">
                                <option value="${CONFIG.CONTRACT_ADDRESSES.Plinko}">Plinko</option>
                                <option value="${CONFIG.CONTRACT_ADDRESSES.Roulette}">Roulette</option>
                                <option value="${CONFIG.CONTRACT_ADDRESSES.Slots}">Slots</option>
                            </select>
                            <select id="authorize-game-action">
                                <option value="true">Authorize</option>
                                <option value="false">Deauthorize</option>
                            </select>
                            <button class="btn btn-warning" onclick="authorizeGame()">Update Authorization</button>
                        </div>
                        <div class="input-group">
                            <label>Check Game Authorization</label>
                            <select id="check-game-select">
                                <option value="${CONFIG.CONTRACT_ADDRESSES.Plinko}">Plinko</option>
                                <option value="${CONFIG.CONTRACT_ADDRESSES.Roulette}">Roulette</option>
                                <option value="${CONFIG.CONTRACT_ADDRESSES.Slots}">Slots</option>
                            </select>
                            <button class="btn btn-info" onclick="checkGameAuth()">Check Status</button>
                        </div>
                    </div>
                </div>
                
                <div class="two-column">
                    <!-- Staking Config -->
                    <div>
                        <h3>⚙️ Staking Configuration</h3>
                        <div class="input-group">
                            <label>Min Stake</label>
                            <input type="text" id="stake-config-min" placeholder="1.0">
                            <label>Max Stake (0 = no limit)</label>
                            <input type="text" id="stake-config-max" placeholder="0">
                            <label>Min Withdraw</label>

        // Admin function implementations
        async function whitelistToken() {
            if (!requireWallet()) return;
            try {
                const tokenAddress = document.getElementById('whitelist-token-address').value;
                const decimals = parseInt(document.getElementById('whitelist-token-decimals').value);
                const minBet = ethers.parseEther(document.getElementById('whitelist-token-minbet').value);
                
                showResult('admin-result', 'info', 'Whitelisting token...');
                document.getElementById('admin-result').classList.remove('hidden');
                
                const tx = await contracts.House.whitelistToken(tokenAddress, decimals, minBet);
                await tx.wait();
                
                showResult('admin-result', 'success', `Token whitelisted successfully! Tx: ${tx.hash}`);
            } catch (error) {
                showResult('admin-result', 'error', 'Error: ' + error.message);
            }
        }

                const stakerPercentBps = parseInt(document.getElementById('config-staker-percent-bps').value);
                const minBet = ethers.parseEther(document.getElementById('config-min-bet').value);
                const maxPayoutPercentBps = parseInt(document.getElementById('config-max-payout-percent-bps').value);
                
                showResult('admin-result', 'info', 'Setting token config...');
                document.getElementById('admin-result').classList.remove('hidden');
                
                const tx = await contracts.House.setTokenConfig(tokenAddress, feeBps, stakerPercentBps, minBet, maxPayoutPercentBps);
                await tx.wait();
                
                showResult('admin-result', 'success', `Token config updated! Tx: ${tx.hash}`);
            } catch (error) {
                showResult('admin-result', 'error', 'Error: ' + error.message);

        async function fundPlayerPool() {
            if (!requireWallet()) return;
            try {
                const tokenSelect = document.getElementById('fund-pool-token').value;
                const tokenAddress = tokenSelect === 'ETH' ? ethers.ZeroAddress : CONFIG.CONTRACT_ADDRESSES.wTENX;
                const amount = ethers.parseEther(document.getElementById('fund-pool-amount').value);
                
                showResult('admin-result', 'info', 'Funding player pool...');
                document.getElementById('admin-result').classList.remove('hidden');
                
                let tx;
                if (tokenSelect === 'ETH') {
                    // For ETH, need to send value
                    tx = await contracts.House.fundPlayerPool(tokenAddress, amount, { value: amount });
                } else {
                    // For tokens, approve first
                    const tokenContract = new ethers.Contract(tokenAddress, abis.wTENToken, signer);
                    const approveTx = await tokenContract.approve(CONFIG.CONTRACT_ADDRESSES.House, amount);
                    await approveTx.wait();
                    tx = await contracts.House.fundPlayerPool(tokenAddress, amount);
                }
                await tx.wait();
                
                showResult('admin-result', 'success', `Player pool funded! Tx: ${tx.hash}`);
            } catch (error) {
                showResult('admin-result', 'error', 'Error: ' + error.message);
            }
        }

        async function viewCurrentConfig() {

        async function refreshStaking() {
            try {
                const totalStaked = await contracts.House.totalStaked();
                const stakingToken = await contracts.House.spinToken();
                const minStake = await contracts.House.minStake();
                const maxStake = await contracts.House.maxStake();
                
                document.getElementById('staking-overview').innerHTML = `
                    <div class="stat-card">

                    <div class="stat-card">

                    </div>
                    <div class="stat-card">
                        <h4>Min Stake</h4>
                        <div class="value">${formatEther5(minStake)}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Max Stake</h4>
                        <div class="value">${maxStake.toString() === '0' ? 'No limit' : formatEther5(maxStake)}</div>

        async function viewUserStaking() {
            try {
                const walletAddress = document.getElementById('staking-wallet').value;

                    document.getElementById('staking-result').classList.remove('hidden');
                    return;
                }
                
                showResult('staking-result', 'info', `Loading staking data for ${walletAddress}...`);
                document.getElementById('staking-result').classList.remove('hidden');
                
                const userStaked = await contracts.House.stakedSPIN(walletAddress);
                const ethPending = await contracts.House.pendingRewards(walletAddress, ethers.ZeroAddress);
                const wtenxPending = await contracts.House.pendingRewards(walletAddress, CONFIG.CONTRACT_ADDRESSES.wTENX);
                
                let stakingText = `📊 Staking Data for ${walletAddress}:\n\n`;
                stakingText += `Staked: ${formatEther5(userStaked)}\n`;
                stakingText += `ETH Pending Rewards: ${formatEther5(ethPending)}\n`;
                stakingText += `wTENX Pending Rewards: ${formatEther5(wtenxPending)}\n`;
                
                showResult('staking-result', 'success', stakingText);
            } catch (error) {
                showResult('staking-result', 'error', 'Error: ' + error.message);
            }
        }

        /* ================= HELPER FUNCTIONS ================= */
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            // Create temporary error message
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.container').firstChild);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        function showResult(elementId, type, message) {
            const element = document.getElementById(elementId);
            if (!element) return;
            element.textContent = message;
            element.className = `result-display ${type}`;
            element.classList.remove('hidden');
        }

        // Numeric formatting helpers (truncate down to 5 decimals)
        function formatFixedDown(valueStr, decimals) {
            const parts = String(valueStr).split('.');
            const integerPart = parts[0];
            const fractionalPart = (parts[1] || '');
            const truncated = fractionalPart.slice(0, decimals).padEnd(decimals, '0');
            return decimals > 0 ? `${integerPart}.${truncated}` : integerPart;
        }

        function formatEther5(wei) {
            try {
                const factor = 10n ** 13n; // 18 - 5 = 13
                const w = BigInt(wei);
                const truncated = (w / factor) * factor; // round down
                const s = ethers.formatEther(truncated);
                return formatFixedDown(s, 5);
            } catch (_) {
                // Fallback
                return formatFixedDown(ethers.formatEther(wei), 5);
            }
        }

        function formatEther5Signed(deltaWei) {
            const d = BigInt(deltaWei);
            if (d === 0n) return '0.00000';
            const negative = d < 0n;
            const abs = negative ? -d : d;
            const formatted = formatEther5(abs);
            return `${negative ? '-' : '+'}${formatted}`;
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
