        .btn {

            color: #000;
            padding: 10px 20px;
            border-radius: 8px;

            margin-right: 10px;

        }

        .btn:hover {

        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;

        .btn-success { background: linear-gradient(to right, #57D67B, #E9B466); }
        .btn-danger { background: linear-gradient(to right, #ff416c, #ff4b2b); }

        .section h3 {
            font-size: 1.2rem;

        .input-group {

        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .input-group input,

            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);

        .input-group small {

            font-size: 12px;

            margin-top: 5px;
        }

        .stats-grid {
            display: grid;

            margin-bottom: 20px;

        .stat-card {

        .result-display.error { border-left: 4px solid #ff416c; }
        .result-display.info { border-left: 4px solid #45b7d1; }

        .hidden { display: none; }

        .progress {
            width: 100%;
            height: 20px;
            background: rgba(30, 30, 30, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);

            height: 100%;

            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;

            0% { transform: rotate(0deg); }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-column {

    <script>
        // ============================================================================
        // LAYER 1: CONFIGURATION & CONSTANTS
        // ============================================================================
        // All configuration values in one place for easy updates
        const CONFIG = {
            // Network Configuration

            // Contract Addresses - UPDATE FROM casino-deployment-info.json

                Roulette: "0x40FC3A1BfEE63652c6749A505f54Bfc3e1293778",
                Slots: "0x1AdD159DC347b94252d134655eA94e0d63Cc086e",

            },
            
            // Starting Pool Amounts (for calculating growth/loss)

            // ABI File Paths (relative to this HTML file)
            ABI_FILES: [
                'abis/DevToken.json',
                'abis/House.json',

                'abis/Roulette.json',
                'abis/Slots.json',

        };

        // Game-specific constants
        const GAME_CONSTANTS = {
            SLOTS: {

                PAYOUT_TABLE: [
                    { symbols: [1, 0, 2], payout: 2.5 }, { symbols: [1, 0, 3], payout: 2.5 }, { symbols: [1, 0, 4], payout: 2.5 },
                    { symbols: [0, 1, 2], payout: 2.5 }, { symbols: [0, 1, 3], payout: 2.5 }, { symbols: [0, 1, 4], payout: 2.5 },
                    { symbols: [2, 1, 0], payout: 2.5 }, { symbols: [3, 1, 0], payout: 2.5 }, { symbols: [4, 1, 0], payout: 2.5 },
                    { symbols: [2, 0, 1], payout: 2.5 }, { symbols: [3, 0, 1], payout: 2.5 }, { symbols: [4, 0, 1], payout: 2.5 },
                    { symbols: [1, 2, 0], payout: 2.5 }, { symbols: [1, 3, 0], payout: 2.5 }, { symbols: [1, 4, 0], payout: 2.5 },
                    { symbols: [0, 2, 1], payout: 2.5 }, { symbols: [0, 3, 1], payout: 2.5 }, { symbols: [0, 4, 1], payout: 2.5 },
                    { symbols: [0, 0, 0], payout: 3 },
                    { symbols: [2, 2, 3], payout: 4 }, { symbols: [2, 2, 4], payout: 4 }, { symbols: [3, 3, 2], payout: 4 },
                    { symbols: [3, 3, 4], payout: 4 }, { symbols: [4, 4, 2], payout: 4 }, { symbols: [4, 4, 3], payout: 4 },
                    { symbols: [3, 2, 2], payout: 4 }, { symbols: [4, 2, 2], payout: 4 }, { symbols: [2, 3, 3], payout: 4 },
                    { symbols: [4, 3, 3], payout: 4 }, { symbols: [2, 4, 4], payout: 4 }, { symbols: [3, 4, 4], payout: 4 },
                    { symbols: [2, 2, 5], payout: 8 }, { symbols: [2, 2, 6], payout: 8 }, { symbols: [3, 3, 5], payout: 8 },
                    { symbols: [3, 3, 6], payout: 8 }, { symbols: [4, 4, 5], payout: 8 }, { symbols: [4, 4, 6], payout: 8 },
                    { symbols: [2, 5, 2], payout: 8 }, { symbols: [2, 6, 2], payout: 8 }, { symbols: [3, 5, 3], payout: 8 },
                    { symbols: [3, 6, 3], payout: 8 }, { symbols: [4, 5, 4], payout: 8 }, { symbols: [4, 6, 4], payout: 8 },
                    { symbols: [5, 2, 2], payout: 8 }, { symbols: [6, 2, 2], payout: 8 }, { symbols: [5, 3, 3], payout: 8 },
                    { symbols: [6, 3, 3], payout: 8 }, { symbols: [5, 4, 4], payout: 8 }, { symbols: [6, 4, 4], payout: 8 },
                    { symbols: [5, 5, 0], payout: 15 }, { symbols: [5, 5, 1], payout: 15 }, { symbols: [5, 5, 2], payout: 15 },
                    { symbols: [5, 5, 3], payout: 15 }, { symbols: [5, 5, 4], payout: 15 }, { symbols: [0, 5, 5], payout: 15 },
                    { symbols: [1, 5, 5], payout: 15 }, { symbols: [2, 5, 5], payout: 15 }, { symbols: [3, 5, 5], payout: 15 },
                    { symbols: [4, 5, 5], payout: 15 }, { symbols: [5, 0, 5], payout: 15 }, { symbols: [5, 1, 5], payout: 15 },
                    { symbols: [5, 2, 5], payout: 15 }, { symbols: [5, 3, 5], payout: 15 }, { symbols: [5, 4, 5], payout: 15 },
                    { symbols: [6, 6, 0], payout: 20 }, { symbols: [6, 6, 1], payout: 20 }, { symbols: [6, 6, 2], payout: 20 },
                    { symbols: [6, 6, 3], payout: 20 }, { symbols: [6, 6, 4], payout: 20 }, { symbols: [0, 6, 6], payout: 20 },
                    { symbols: [1, 6, 6], payout: 20 }, { symbols: [2, 6, 6], payout: 20 }, { symbols: [3, 6, 6], payout: 20 },
                    { symbols: [4, 6, 6], payout: 20 }, { symbols: [6, 0, 6], payout: 20 }, { symbols: [6, 1, 6], payout: 20 },
                    { symbols: [6, 2, 6], payout: 20 }, { symbols: [6, 3, 6], payout: 20 }, { symbols: [6, 4, 6], payout: 20 },
                    { symbols: [5, 5, 5], payout: 30 }, { symbols: [5, 6, 5], payout: 30 }, { symbols: [6, 5, 5], payout: 30 },
                    { symbols: [5, 5, 6], payout: 30 },
                    { symbols: [6, 5, 6], payout: 50 }, { symbols: [6, 6, 6], payout: 50 }
                ]
            },
            ROULETTE: {
                BET_TYPE_NAMES: [
                    'STRAIGHT', 'RED', 'BLACK', 'EVEN', 'ODD', 'LOW',
                    'HIGH', 'DOZEN1', 'DOZEN2', 'DOZEN3', 'COLUMN1', 'COLUMN2', 'COLUMN3'
                ]
            }
        };

        // ============================================================================
        // LAYER 2: GLOBAL STATE MANAGEMENT
        // ============================================================================
        // Centralized state - all application state in one place
        const State = {
            // Wallet & Provider
            provider: null,
            signer: null,
            account: null,
            readOnlyProvider: null,
            
            // Contracts & ABIs
            contracts: {},
            abis: {},
            
            // Extraction state per game
            extraction: {
                slots: { data: [], isPaused: false, currentGameId: 0, maxGameId: 0, checkpoint: null },
                plinko: { data: [], isPaused: false, currentGameId: 0, maxGameId: 0, checkpoint: null },
                roulette: { data: [], isPaused: false, currentGameId: 0, maxGameId: 0, checkpoint: null }
            },
            
            // RPC rotation
            rpcUrls: [CONFIG.TEN_RPC_URL],
            rpcIndex: 0
        };

        // ============================================================================
        // LAYER 3: UTILITY FUNCTIONS
        // ============================================================================
        // Reusable utility functions - no side effects, pure functions where possible
        
        const Utils = {
            // Formatting utilities
            formatFixedDown(valueStr, decimals) {
                const parts = String(valueStr).split('.');
                const integerPart = parts[0];
                const fractionalPart = (parts[1] || '');
                const truncated = fractionalPart.slice(0, decimals).padEnd(decimals, '0');
                return decimals > 0 ? `${integerPart}.${truncated}` : integerPart;
            },

            formatEther5(wei) {
                try {
                    const factor = 10n ** 13n; // 18 - 5 = 13
                    const w = BigInt(wei);
                    const truncated = (w / factor) * factor;
                    const s = ethers.formatEther(truncated);
                    return this.formatFixedDown(s, 5);
                } catch (_) {
                    return this.formatFixedDown(ethers.formatEther(wei), 5);
                }
            },

            formatEther5Signed(deltaWei) {
                const d = BigInt(deltaWei);
                if (d === 0n) return '0.00000';
                const negative = d < 0n;
                const abs = negative ? -d : d;
                const formatted = this.formatEther5(abs);
                return `${negative ? '-' : '+'}${formatted}`;
            },

            formatEther(value) {
                if (!value) return '0';
                return ethers.formatEther(value.toString());
            },

            getTokenName(address) {
                return address.toLowerCase() === ethers.ZeroAddress.toLowerCase() ? 'ETH' : 'wTENX';
            },

            // RPC rotation
            getNextRpcUrl() {
                if (State.rpcUrls.length === 0) return CONFIG.TEN_RPC_URL;
                const url = State.rpcUrls[State.rpcIndex];
                State.rpcIndex = (State.rpcIndex + 1) % State.rpcUrls.length;
                return url;
            }
        };

        // ============================================================================
        // LAYER 4: UI HELPER FUNCTIONS
        // ============================================================================
        // All UI manipulation functions - centralized for consistency
        
        const UI = {
            showLoading(show) {
                document.getElementById('loading').style.display = show ? 'block' : 'none';
            },

            showError(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.container').firstChild);
                setTimeout(() => errorDiv.remove(), 5000);
            },

            showResult(elementId, type, message) {
                const element = document.getElementById(elementId);
                if (!element) return;
                element.textContent = message;
                element.className = `result-display ${type}`;
                element.classList.remove('hidden');
            },

            updateProgress(gameType, current, total) {
                const container = document.getElementById(`${gameType}-progress-container`);
                const bar = document.getElementById(`${gameType}-progress-bar`);
                if (total > 0 && container && bar) {
                    container.classList.remove('hidden');
                    const percent = Math.round((current / total) * 100);
                    bar.style.width = `${percent}%`;
                    bar.textContent = `${percent}% (${current}/${total})`;
                }
            },

            updateStatus(gameType, message, type = 'info') {
                this.showResult(`${gameType}-result`, type, message);
                const element = document.getElementById(`${gameType}-result`);
                if (element) element.classList.remove('hidden');
            }
        };

        // ============================================================================
        // LAYER 5: CONTRACT MANAGEMENT
        // ============================================================================
        // All contract-related operations - ABI loading, contract initialization
        
        const Contracts = {
            async loadABIs() {
                for (const file of CONFIG.ABI_FILES) {
                    try {
                        const response = await fetch(file);
                        const abi = await response.json();
                        const contractName = file.split('/')[1].replace('.json', '');
                        State.abis[contractName] = abi;
                        console.log(`✅ Loaded ABI: ${contractName}`);
                    } catch (error) {
                        console.error(`❌ Failed to load ABI: ${file}`, error);
                    }
                }
            },

            initializeReadOnlyContracts() {
                State.readOnlyProvider = new ethers.JsonRpcProvider(CONFIG.TEN_RPC_URL);
                State.contracts.House = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.House, State.abis.House, State.readOnlyProvider);
                State.contracts.DevToken = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.DevToken, State.abis.DevToken, State.readOnlyProvider);
                State.contracts.Plinko = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Plinko, State.abis.Plinko, State.readOnlyProvider);
                State.contracts.Roulette = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Roulette, State.abis.Roulette, State.readOnlyProvider);
                State.contracts.Slots = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Slots, State.abis.Slots, State.readOnlyProvider);
            },

            upgradeToWritableContracts() {
                State.contracts.House = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.House, State.abis.House, State.signer);
                State.contracts.DevToken = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.DevToken, State.abis.DevToken, State.signer);
                State.contracts.Plinko = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Plinko, State.abis.Plinko, State.signer);
                State.contracts.Roulette = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Roulette, State.abis.Roulette, State.signer);
                State.contracts.Slots = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Slots, State.abis.Slots, State.signer);
            },

            createExtractionProvider(contractAddress, abi) {
                const rpcUrl = Utils.getNextRpcUrl();
                const provider = new ethers.JsonRpcProvider(rpcUrl);
                const contract = new ethers.Contract(contractAddress, abi, provider);
                return { provider, contract };
            }
        };

        // ============================================================================
        // LAYER 6: WALLET MANAGEMENT
        // ============================================================================
        // All wallet connection and verification logic
        
        const Wallet = {
            requireWallet() {
                if (!State.signer || !State.account) {
                    UI.showError('⚠️  Please connect your wallet to perform this action.');
                    return false;
                }
                return true;
            },

            async connect() {
                try {
                    if (typeof window.ethereum === 'undefined') {
                        UI.showError('MetaMask or compatible wallet not found. Please install MetaMask.');
                        return;
                    }

                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    State.account = accounts[0];

                    State.provider = new ethers.BrowserProvider(window.ethereum);
                    State.signer = await State.provider.getSigner();

                    Contracts.upgradeToWritableContracts();

                    // Verify ownership
                    try {
                        const owner = await State.contracts.House.owner();
                        if (owner.toLowerCase() !== State.account.toLowerCase()) {
                            UI.showError('⚠️  Warning: You are not the owner of the House contract. Some functions may fail.');
                        }
                    } catch (error) {
                        console.warn('Could not verify ownership:', error);
                    }

                    // Update UI
                    document.getElementById('wallet-status').textContent = 'Connected';
                    document.getElementById('wallet-address').textContent = State.account;
                    document.getElementById('wallet-address').classList.remove('hidden');
                    document.getElementById('connect-btn').textContent = 'Connected';
                    document.getElementById('connect-btn').disabled = true;

                    // Refresh data
                    await Stats.refresh();
                    await Staking.refresh();

                    console.log('✅ Wallet connected:', State.account);
                } catch (error) {
                    console.error('❌ Wallet connection failed:', error);
                    UI.showError('Failed to connect wallet: ' + error.message);
                }
            }
        };

        // ============================================================================
        // LAYER 13: EXTRACTION ENGINE
        // ============================================================================
        // Shared extraction functionality for all games
        
        const Extraction = {
            // Checkpoint management
            saveCheckpoint(gameType) {
                const state = State.extraction[gameType];
                state.checkpoint = {
                    lastGameId: state.currentGameId,
                    data: state.data,
                    timestamp: Date.now()
                };
                localStorage.setItem(`extraction-checkpoint-${gameType}`, JSON.stringify(state.checkpoint));
            },

            loadCheckpoint(gameType) {
                const saved = localStorage.getItem(`extraction-checkpoint-${gameType}`);
                if (saved) {
                    const checkpoint = JSON.parse(saved);
                    State.extraction[gameType].checkpoint = checkpoint;
                    State.extraction[gameType].data = checkpoint.data || [];
                    document.getElementById(`${gameType}-extract-start`).value = checkpoint.lastGameId + 1;
                    return true;
                }
                return false;
            },

            clearCheckpoint(gameType) {
                localStorage.removeItem(`extraction-checkpoint-${gameType}`);
                State.extraction[gameType].checkpoint = null;
            },

            // Generic extraction runner
            async run(gameType, extractorFn, getMaxGameIdFn) {
                const state = State.extraction[gameType];
                const startGameId = parseInt(document.getElementById(`${gameType}-extract-start`).value);
                const endGameId = parseInt(document.getElementById(`${gameType}-extract-end`).value);
                const maxGames = parseInt(document.getElementById(`${gameType}-extract-max`).value);
                const requestDelay = parseInt(document.getElementById(`${gameType}-extract-delay`).value);

                if (endGameId === 0) {
                    UI.updateStatus(gameType, 'Fetching current game count...', 'info');
                    state.maxGameId = await getMaxGameIdFn();
                } else {
                    state.maxGameId = endGameId;
                }

                state.currentGameId = startGameId - 1;
                state.isPaused = false;

                UI.updateStatus(gameType, `Starting extraction from game ${startGameId} to ${state.maxGameId}...`, 'info');

                let processed = 0;
                const targetGames = maxGames > 0 ? Math.min(maxGames, state.maxGameId - startGameId + 1) : (state.maxGameId - startGameId + 1);

                while (state.currentGameId < state.maxGameId && (maxGames === 0 || processed < maxGames)) {
                    if (state.isPaused) {
                        UI.updateStatus(gameType, 'Extraction paused. Click Resume to continue.', 'info');
                        this.saveCheckpoint(gameType);
                        return;
                    }

                    state.currentGameId++;
                    UI.updateStatus(gameType, `Processing game ${state.currentGameId}/${state.maxGameId}...`, 'info');
                    UI.updateProgress(gameType, processed, targetGames);

                    let retryCount = 0;
                    const maxRetries = 10;
                    let gameData = null;
                    let hasWaited = false;

                    while (!gameData && retryCount < maxRetries) {
                        try {
                            gameData = await extractorFn(state.currentGameId);
                            if (gameData) {
                                if (Array.isArray(gameData)) {
                                    state.data.push(...gameData);
                                } else {
                                    state.data.push(gameData);
                                }
                                processed++;
                                this.saveCheckpoint(gameType);
                                break;
                            }
                        } catch (error) {
                            retryCount++;
                            if (retryCount < maxRetries) {
                                UI.updateStatus(gameType, `Game ${state.currentGameId} failed (attempt ${retryCount}/${maxRetries}). Retrying...`, 'error');
                                await new Promise(resolve => setTimeout(resolve, requestDelay));
                            } else if (retryCount === maxRetries && !hasWaited) {
                                UI.updateStatus(gameType, `Game ${state.currentGameId} failed ${retryCount} times. Waiting 10 seconds...`, 'error');
                                await new Promise(resolve => setTimeout(resolve, 10000));
                                hasWaited = true;
                                retryCount--;
                            } else {
                                UI.updateStatus(gameType, `Game ${state.currentGameId} failed after ${retryCount} attempts. Skipping...`, 'error');
                                break;
                            }
                        }
                    }

                    if (state.currentGameId < state.maxGameId && (maxGames === 0 || processed < maxGames)) {
                        await new Promise(resolve => setTimeout(resolve, requestDelay));
                    }
                }

                UI.updateStatus(gameType, `Extraction complete! Processed ${processed} games, extracted ${state.data.length} rows.`, 'success');
                UI.updateProgress(gameType, targetGames, targetGames);
                this.clearCheckpoint(gameType);
            },

            async start(gameType) {
                if (this.loadCheckpoint(gameType)) {
                    UI.updateStatus(gameType, 'Checkpoint found. Resuming...', 'info');
                }
                const extractors = {
                    slots: { extract: Extractors.extractSlots, maxId: Extractors.getSlotsMaxGameId },
                    plinko: { extract: Extractors.extractPlinko, maxId: Extractors.getPlinkoMaxGameId },
                    roulette: { extract: Extractors.extractRoulette, maxId: Extractors.getRouletteMaxGameId }
                };
                await this.run(gameType, extractors[gameType].extract, extractors[gameType].maxId);
            },

            pause(gameType) {
                State.extraction[gameType].isPaused = true;
            },

            resume(gameType) {
                State.extraction[gameType].isPaused = false;
                this.start(gameType);
            },

            downloadCSV(gameType) {
                const data = State.extraction[gameType].data;
                if (data.length === 0) {
                    alert('No data to download!');
                    return;
                }

                const headers = {
                    slots: ['Game ID', 'Spin Index', 'Player', 'Token', 'Token Name', 'Bet Per Spin', 'Total Bet', 'Total Payout', 'Num Spins', 'Reel 1', 'Reel 2', 'Reel 3', 'Reel Results', 'Multiplier', 'Spin Payout', 'Net Result'],
                    plinko: ['Game ID', 'Ball Index', 'Player', 'Token', 'Token Name', 'Bet Per Ball', 'Total Bet', 'Total Payout', 'Num Balls', 'Bucket', 'Net Result'],
                    roulette: ['Game ID', 'Player', 'Token', 'Token Name', 'Total Bet', 'Total Payout', 'Num Bets', 'Winning Number', 'Net Result']
                };

                const keyMaps = {
                    slots: { 'Game ID': 'gameId', 'Spin Index': 'spinIndex', 'Player': 'player', 'Token': 'token', 'Token Name': 'tokenName', 'Bet Per Spin': 'betPerSpin', 'Total Bet': 'totalBet', 'Total Payout': 'totalPayout', 'Num Spins': 'numSpins', 'Reel 1': 'reel1', 'Reel 2': 'reel2', 'Reel 3': 'reel3', 'Reel Results': 'reelResult', 'Multiplier': 'multiplier', 'Spin Payout': 'spinPayout', 'Net Result': 'netResult' },
                    plinko: { 'Game ID': 'gameId', 'Ball Index': 'ballIndex', 'Player': 'player', 'Token': 'token', 'Token Name': 'tokenName', 'Bet Per Ball': 'betPerBall', 'Total Bet': 'totalBet', 'Total Payout': 'totalPayout', 'Num Balls': 'numBalls', 'Bucket': 'bucket', 'Net Result': 'netResult' },
                    roulette: { 'Game ID': 'gameId', 'Player': 'player', 'Token': 'token', 'Token Name': 'tokenName', 'Total Bet': 'totalBet', 'Total Payout': 'totalPayout', 'Num Bets': 'numBets', 'Winning Number': 'winningNumber', 'Net Result': 'netResult' }
                };

                const csvRows = [headers[gameType].join(',')];
                const keyMap = keyMaps[gameType];
                data.forEach(row => {
                    const values = headers[gameType].map(header => {
                        const key = keyMap[header];
                        return row[key] || '';
                    });
                    csvRows.push(values.map(v => `"${String(v)}"`).join(','));
                });

                const csvContent = csvRows.join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `memespin-${gameType}-data-${Date.now()}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
            },

            clear(gameType) {
                if (confirm(`Clear all ${gameType} extraction data?`)) {
                    State.extraction[gameType].data = [];
                    this.clearCheckpoint(gameType);
                    UI.updateStatus(gameType, 'Data cleared.', 'info');
                }
            }
        };

        // ============================================================================
        // LAYER 14: GAME-SPECIFIC EXTRACTORS
        // ============================================================================
        
        const Extractors = {
            // Slots extractor
            calculateSlotsMultiplier(reel1, reel2, reel3) {
                const match = GAME_CONSTANTS.SLOTS.PAYOUT_TABLE.find(e => 
                    e.symbols[0] === reel1 && e.symbols[1] === reel2 && e.symbols[2] === reel3
                );
                return match ? match.payout : 0;
            },

            getSlotsSymbolName(index) {
                return index >= 0 && index < GAME_CONSTANTS.SLOTS.SYMBOL_NAMES.length 
                    ? GAME_CONSTANTS.SLOTS.SYMBOL_NAMES[index] : 'LEAFS';
            },

            getSlotsReelResult(reel1, reel2, reel3) {
                return `${this.getSlotsSymbolName(reel1)}.${this.getSlotsSymbolName(reel2)}.${this.getSlotsSymbolName(reel3)}`;
            },

            async extractSlots(gameId) {
                const { contract } = Contracts.createExtractionProvider(CONFIG.CONTRACT_ADDRESSES.Slots, State.abis.Slots);
                const game = await contract.getGame(gameId);
                
                if (!game || !game.hasEnded) return null;

                const betPerSpin = Utils.formatEther(game.betAmount);
                const numSpins = Number(game.numSpins);
                const totalBet = parseFloat(betPerSpin) * numSpins;
                const totalPayout = Utils.formatEther(game.payout);
                const tokenName = Utils.getTokenName(game.token);

                const rows = [];
                for (let i = 0; i < numSpins; i++) {
                    const reel1 = Number(game.num0[i]);
                    const reel2 = Number(game.num1[i]);
                    const reel3 = Number(game.num2[i]);
                    const multiplier = this.calculateSlotsMultiplier(reel1, reel2, reel3);
                    const spinPayout = parseFloat(betPerSpin) * multiplier;
                    rows.push({
                        gameId: gameId.toString(),
                        spinIndex: i + 1,
                        player: game.player,
                        token: game.token,
                        tokenName,
                        betPerSpin,
                        totalBet: totalBet.toFixed(6),
                        totalPayout,
                        numSpins,
                        reel1, reel2, reel3,
                        reelResult: this.getSlotsReelResult(reel1, reel2, reel3),
                        multiplier,
                        spinPayout: spinPayout.toFixed(6),
                        netResult: (parseFloat(totalPayout) - totalBet).toFixed(6)
                    });
                }
                return rows;
            },

            async getSlotsMaxGameId() {
                const { contract } = Contracts.createExtractionProvider(CONFIG.CONTRACT_ADDRESSES.Slots, State.abis.Slots);
                const nextId = await contract.nextGameId();
                return Number(nextId) - 1;
            },

            // Plinko extractor
            async extractPlinko(gameId) {
                const { contract } = Contracts.createExtractionProvider(CONFIG.CONTRACT_ADDRESSES.Plinko, State.abis.Plinko);
                const game = await contract.getGame(gameId);
                
                if (!game || !game.hasEnded) return null;

                const betPerBall = Utils.formatEther(game.betAmount);
                const numBalls = Number(game.numBalls);
                const totalBet = parseFloat(betPerBall) * numBalls;
                const totalPayout = Utils.formatEther(game.payout);
                const tokenName = Utils.getTokenName(game.token);
                const buckets = game.buckets || [];

                const rows = [];
                for (let i = 0; i < numBalls; i++) {
                    const bucket = Number(buckets[i] || 0);
                    rows.push({
                        gameId: gameId.toString(),
                        ballIndex: i + 1,
                        player: game.player,
                        token: game.token,
                        tokenName,
                        betPerBall,
                        totalBet: totalBet.toFixed(6),
                        totalPayout,
                        numBalls,
                        bucket,
                        netResult: (parseFloat(totalPayout) - totalBet).toFixed(6)
                    });
                }
                return rows;
            },

            async getPlinkoMaxGameId() {
                const { contract } = Contracts.createExtractionProvider(CONFIG.CONTRACT_ADDRESSES.Plinko, State.abis.Plinko);
                const nextId = await contract.nextGameId();
                return Number(nextId) - 1;
            },

            // Roulette extractor
            async extractRoulette(gameId) {
                const { contract } = Contracts.createExtractionProvider(CONFIG.CONTRACT_ADDRESSES.Roulette, State.abis.Roulette);
                const game = await contract.getGame(gameId);
                
                if (!game || !game.hasEnded) return null;

                let totalBetWei = 0n;
                for (let i = 0; i < game.bets.length; i++) {
                    totalBetWei += BigInt(game.bets[i].amount);
                }
                
                const totalBet = Utils.formatEther(totalBetWei);
                const totalPayout = Utils.formatEther(game.totalPayout);
                const tokenName = Utils.getTokenName(game.token);
                const winningNumber = Number(game.winningNumber);
                const numBets = game.bets.length;

                return {
                    gameId: gameId.toString(),
                    player: game.player,
                    token: game.token,
                    tokenName,
                    totalBet,
                    totalPayout,
                    numBets,
                    winningNumber,
                    netResult: (parseFloat(totalPayout) - parseFloat(totalBet)).toFixed(6)
                };
            },

            async getRouletteMaxGameId() {
                const { contract } = Contracts.createExtractionProvider(CONFIG.CONTRACT_ADDRESSES.Roulette, State.abis.Roulette);
                const nextId = await contract.nextGameId();
                return Number(nextId) - 1;
            }
        };

        // ============================================================================
        // LAYER 15: INITIALIZATION
        // ============================================================================
        // Main initialization and section orchestration
        
        async function init() {
            try {
                UI.showLoading(true);
                
                await Contracts.loadABIs();
                Contracts.initializeReadOnlyContracts();
                
                // Initialize all sections
                await Stats.init();
                await ContractData.init();
                await Points.init();
                await Staking.init();
                await Admin.init();
                await SlotsConfig.init();
                await PlinkoConfig.init();
                await RouletteConfig.init();
                
                UI.showLoading(false);
                console.log('✅ Admin panel initialized (read-only mode)');
            } catch (error) {
                console.error('❌ Initialization failed:', error);
                UI.showError('Failed to initialize admin panel: ' + error.message);
                UI.showLoading(false);
            }
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
