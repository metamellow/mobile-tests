<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memespin Casino Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
    <style>
        /* ================= CONFIG VARIABLES - EDIT THESE ================= */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --card-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.2);
            --text-primary: #fff;
            --text-secondary: #e0e0e0;
            --accent-1: #667eea;
            --accent-2: #764ba2;
            --success: #56ab2f;
            --danger: #ff416c;
            --warning: #f093fb;
            --info: #45b7d1;
        }

        /* ================= GLOBAL STYLES ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary), var(--bg-tertiary));
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(45deg, var(--accent-1), var(--accent-2));
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success { background: linear-gradient(45deg, var(--success), #a8e6cf); }
        .btn-danger { background: linear-gradient(45deg, var(--danger), #ff4b2b); }
        .btn-warning { background: linear-gradient(45deg, var(--warning), #f5576c); }
        .btn-info { background: linear-gradient(45deg, var(--info), #764ba2); }

        .section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        .section h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--info);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .section h3 {
            font-size: 1.2rem;
            margin: 15px 0 10px 0;
            color: var(--accent-1);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 14px;
        }

        .input-group small {
            color: var(--text-secondary);
            font-size: 12px;
            display: block;
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h4 {
            color: var(--info);
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .stat-card .value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .result-display {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .result-display.success { border-left: 4px solid var(--success); }
        .result-display.error { border-left: 4px solid var(--danger); }
        .result-display.info { border-left: 4px solid var(--info); }

        .hidden { display: none; }

        .error-message {
            color: var(--danger);
            background: rgba(255, 65, 108, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid rgba(255, 65, 108, 0.3);
        }

        .success-message {
            color: var(--success);
            background: rgba(86, 171, 47, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid rgba(86, 171, 47, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎰 Memespin Casino Admin Panel</h1>
            <p>Administrative interface for managing the casino ecosystem</p>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Main Content -->
        <div id="main-content">
            <!-- Statistics Section -->
            <div class="section" id="stats-section">
                <h2>📊 Statistics</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Contract Data Dump Section -->
            <div class="section" id="contract-data-section">
                <h2>📋 Contract Configuration & Data</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Points Section -->
            <div class="section" id="points-section">
                <h2>🏆 Points Viewer</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Staking Data Section -->
            <div class="section" id="staking-section">
                <h2>🪙 Staking Data</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Status Bar (for admin functions) -->
            <div class="status-bar">
                <div class="wallet-info">
                    <span id="wallet-status">Not Connected</span>
                    <span id="wallet-address" class="hidden"></span>
                </div>
                <button class="btn" id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
            </div>

            <!-- Admin Functions Section -->
            <div class="section" id="admin-section">
                <h2>⚙️ Admin Functions</h2>
                <!-- Content will be added by JavaScript -->
            </div>

            <!-- Slots Management Section -->
            <div class="section" id="slots-section">
                <h2>🎰 Slots Management</h2>
                <!-- Content will be added by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        /* ================= CONFIGURATION VARIABLES - EDIT THESE ================= */
        // Contract addresses - UPDATE THESE FROM casino-deployment-info.json
        const CONFIG = {
            // Network Configuration
            TEN_RPC_URL: 'https://testnet-rpc.ten.xyz/v1/?token=34F99D7ACF7B6940A0381D89DFF468600515D531',
            
            // Contract Addresses
            CONTRACT_ADDRESSES: {
                DevToken: "0x38348ff7f09705ADA54d0979b607003B7616A44F",
                House: "0x9CC5805A71571f3306b7357546566Ef4CbF78F1C",
                Plinko: "0x3aa56C1D3835B536573646cF63829257236D54A9",
                Roulette: "0x40FC3A1BfEE63652c6749A505f54Bfc3e1293778",
                Slots: "0x1AdD159DC347b94252d134655eA94e0d63Cc086e",
                wTENX: "0x10107E1160026A0311a4Be3C0d39b96BCf851010"
            },
            
            // Starting Pool Amounts (for calculating growth/loss)
            // These can be edited in browser for temporary changes
            STARTING_POOL_AMOUNTS: {
                ETH: "2.0",          // Starting ETH player pool amount
                wTENX: "18935.32863"     // Starting wTENX player pool amount
            },
            
            // ABI File Paths (relative to this HTML file)
            ABI_FILES: [
                'abis/DevToken.json',
                'abis/House.json',
                'abis/Plinko.json',
                'abis/Roulette.json',
                'abis/Slots.json',
                'abis/wTENToken.json'
            ]
        };

        /* ================= GLOBAL STATE ================= */
        let provider = null;
        let signer = null;
        let account = null;
        let contracts = {};
        let abis = {};
        let readOnlyProvider = null;

        /* ================= INITIALIZATION ================= */
        async function init() {
            try {
                showLoading(true);
                
                // Load ABIs
                await loadABIs();
                
                // Initialize read-only provider and contracts for viewing data
                readOnlyProvider = new ethers.JsonRpcProvider(CONFIG.TEN_RPC_URL);
                
                // Initialize read-only contracts (for viewing data without wallet)
                contracts.House = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.House, abis.House, readOnlyProvider);
                contracts.DevToken = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.DevToken, abis.DevToken, readOnlyProvider);
                contracts.Plinko = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Plinko, abis.Plinko, readOnlyProvider);
                contracts.Roulette = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Roulette, abis.Roulette, readOnlyProvider);
                contracts.Slots = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Slots, abis.Slots, readOnlyProvider);
                
                // Show main content immediately (for read-only viewing)
                // No longer hiding main-content since it's always visible now
                
                // Initialize sections (read-only mode)
                await initAllSections();
                
                showLoading(false);
                
                console.log('✅ Admin panel initialized (read-only mode)');
            } catch (error) {
                console.error('❌ Initialization failed:', error);
                showError('Failed to initialize admin panel: ' + error.message);
                showLoading(false);
            }
        }

        /* ================= ABI LOADING ================= */
        async function loadABIs() {
            for (const file of CONFIG.ABI_FILES) {
                try {
                    const response = await fetch(file);
                    const abi = await response.json();
                    const contractName = file.split('/')[1].replace('.json', '');
                    abis[contractName] = abi;
                    console.log(`✅ Loaded ABI: ${contractName}`);
                } catch (error) {
                    console.error(`❌ Failed to load ABI: ${file}`, error);
                }
            }
        }

        /* ================= WALLET CONNECTION ================= */
        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    showError('MetaMask or compatible wallet not found. Please install MetaMask.');
                    return;
                }

                // Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                account = accounts[0];

                // Create provider and signer
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();

                // Upgrade contracts to writable (with signer)
                contracts.House = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.House, abis.House, signer);
                contracts.DevToken = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.DevToken, abis.DevToken, signer);
                contracts.Plinko = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Plinko, abis.Plinko, signer);
                contracts.Roulette = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Roulette, abis.Roulette, signer);
                contracts.Slots = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.Slots, abis.Slots, signer);

                // Verify ownership
                try {
                    const owner = await contracts.House.owner();
                    if (owner.toLowerCase() !== account.toLowerCase()) {
                        showError('⚠️  Warning: You are not the owner of the House contract. Some functions may fail.');
                    }
                } catch (error) {
                    console.warn('Could not verify ownership:', error);
                }

                // Update UI
                document.getElementById('wallet-status').textContent = 'Connected';
                document.getElementById('wallet-address').textContent = account;
                document.getElementById('wallet-address').classList.remove('hidden');
                document.getElementById('connect-btn').textContent = 'Connected';
                document.getElementById('connect-btn').disabled = true;

                // Refresh data with writable contracts
                await refreshStats();
                await refreshStaking();

                console.log('✅ Wallet connected:', account);
            } catch (error) {
                console.error('❌ Wallet connection failed:', error);
                showError('Failed to connect wallet: ' + error.message);
            }
        }

        /* ================= WALLET CHECK HELPER ================= */
        function requireWallet() {
            if (!signer || !account) {
                showError('⚠️  Please connect your wallet to perform this action.');
                return false;
            }
            return true;
        }

        /* ================= SECTION INITIALIZATION ================= */
        async function initAllSections() {
            try {
                await initStatsSection();
                await initContractDataSection();
                await initStakingSection();
                await initPointsSection();
                await initAdminSection();
                await initSlotsSection();
            } catch (error) {
                console.error('❌ Section initialization failed:', error);
                showError('Failed to initialize sections: ' + error.message);
            }
        }

        /* ================= STATISTICS SECTION ================= */
        async function initStatsSection() {
            const section = document.getElementById('stats-section');
            section.innerHTML = `
                <h3>🎮 Games Played</h3>
                <div class="stats-grid" id="games-stats"></div>
                
                <h3>💰 Pool Amounts</h3>
                <div class="input-group">
                    <label>Starting Pool Amounts (for growth calculation)</label>
                    <div class="two-column">
                        <input type="text" id="starting-eth-pool" value="${CONFIG.STARTING_POOL_AMOUNTS.ETH}" placeholder="Starting ETH">
                        <input type="text" id="starting-wtenx-pool" value="${CONFIG.STARTING_POOL_AMOUNTS.wTENX}" placeholder="Starting wTENX">
                    </div>
                    <small>Edit these values to recalculate growth. Changes are temporary (session only).</small>
                </div>
                <div class="stats-grid" id="pool-stats"></div>
                
                <h3>💸 Dev Fees Collected</h3>
                <div class="stats-grid" id="dev-fees-stats"></div>
                
                <button class="btn btn-info" onclick="refreshStats()">🔄 Refresh Statistics</button>
                <div id="stats-result" class="result-display hidden"></div>
            `;
            await refreshStats();
        }

        async function refreshStats() {
            try {
                showResult('stats-result', 'info', 'Loading statistics...');
                document.getElementById('stats-result').classList.remove('hidden');

                // Games played
                const slotsGames = await contracts.Slots.nextGameId();
                const plinkoGames = await contracts.Plinko.nextGameId();
                const rouletteGames = await contracts.Roulette.nextGameId();
                
                document.getElementById('games-stats').innerHTML = `
                    <div class="stat-card">
                        <h4>Slots Games</h4>
                        <div class="value">${(slotsGames - 1n).toString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Plinko Games</h4>
                        <div class="value">${(plinkoGames - 1n).toString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Roulette Games</h4>
                        <div class="value">${(rouletteGames - 1n).toString()}</div>
                    </div>
                    <div class="stat-card">
                        <h4>Total Games</h4>
                        <div class="value">${(slotsGames + plinkoGames + rouletteGames - 3n).toString()}</div>
                    </div>
                `;

                // Pool amounts (accounting values from contract)
                const ethPlayerPool = await contracts.House.playerPools(ethers.ZeroAddress);
                const ethStakerPool = await contracts.House.stakerPools(ethers.ZeroAddress);
                const wtenxPlayerPool = await contracts.House.playerPools(CONFIG.CONTRACT_ADDRESSES.wTENX);
                const wtenxStakerPool = await contracts.House.stakerPools(CONFIG.CONTRACT_ADDRESSES.wTENX);

                // Actual contract balances
                const houseAddress = CONFIG.CONTRACT_ADDRESSES.House;
                const actualEthBalance = await readOnlyProvider.getBalance(houseAddress);
                const wtenxTokenContract = new ethers.Contract(CONFIG.CONTRACT_ADDRESSES.wTENX, abis.wTENToken, readOnlyProvider);
                const actualWTENXBalance = await wtenxTokenContract.balanceOf(houseAddress);

                const startingEthWei = ethers.parseEther(String(CONFIG.STARTING_POOL_AMOUNTS.ETH || '0'));
                const startingWTENXWei = ethers.parseEther(String(CONFIG.STARTING_POOL_AMOUNTS.wTENX || '0'));
                const ethGrowthWei = (BigInt(ethPlayerPool)) - (BigInt(startingEthWei));
                const wtenxGrowthWei = (BigInt(wtenxPlayerPool)) - (BigInt(startingWTENXWei));

                // Calculate difference between actual balance and accounting
                const ethDiff = BigInt(actualEthBalance) - BigInt(ethPlayerPool) - BigInt(ethStakerPool);
                const wtenxDiff = BigInt(actualWTENXBalance) - BigInt(wtenxPlayerPool) - BigInt(wtenxStakerPool);

                document.getElementById('pool-stats').innerHTML = `
                    <div class="stat-card">
                        <h4>ETH Player Pool (Accounting)</h4>
                        <div class="value">${formatEther5(ethPlayerPool)} ETH</div>
                        <small>${formatEther5Signed(ethGrowthWei)} ETH</small>
                        <small style="color: ${ethDiff !== 0n ? 'var(--warning)' : 'var(--text-secondary)'}; margin-top: 5px; display: block;">
                            Actual Balance: ${formatEther5(actualEthBalance)} ETH
                            ${ethDiff !== 0n ? ` (Diff: ${formatEther5Signed(ethDiff)})` : ''}
                        </small>
                    </div>
                    <div class="stat-card">
                        <h4>ETH Staker Pool</h4>
                        <div class="value">${formatEther5(ethStakerPool)} ETH</div>
                    </div>
                    <div class="stat-card">
                        <h4>wTENX Player Pool (Accounting)</h4>
                        <div class="value">${formatEther5(wtenxPlayerPool)} wTENX</div>
                        <small>${formatEther5Signed(wtenxGrowthWei)} wTENX</small>
                        <small style="color: ${wtenxDiff !== 0n ? 'var(--warning)' : 'var(--text-secondary)'}; margin-top: 5px; display: block;">
                            Actual Balance: ${formatEther5(actualWTENXBalance)} wTENX
                            ${wtenxDiff !== 0n ? ` (Diff: ${formatEther5Signed(wtenxDiff)})` : ''}
                        </small>
                    </div>
                    <div class="stat-card">
                        <h4>wTENX Staker Pool</h4>
                        <div class="value">${formatEther5(wtenxStakerPool)} wTENX</div>
                    </div>
                `;

                // Dev fees
                const ethDevFees = await contracts.House.devFeesCollected(ethers.ZeroAddress);
                const wtenxDevFees = await contracts.House.devFeesCollected(CONFIG.CONTRACT_ADDRESSES.wTENX);

                document.getElementById('dev-fees-stats').innerHTML = `
                    <div class="stat-card">
                        <h4>ETH Dev Fees</h4>
                        <div class="value">${formatEther5(ethDevFees)} ETH</div>
                    </div>
                    <div class="stat-card">
                        <h4>wTENX Dev Fees</h4>
                        <div class="value">${formatEther5(wtenxDevFees)} wTENX</div>
                    </div>
                `;

                // Update config from inputs (if changed)
                const startingEthInput = document.getElementById('starting-eth-pool').value;
                const startingWTENXInput = document.getElementById('starting-wtenx-pool').value;
                CONFIG.STARTING_POOL_AMOUNTS.ETH = startingEthInput;
                CONFIG.STARTING_POOL_AMOUNTS.wTENX = startingWTENXInput;

                // Refresh staking overview in stats section
                await refreshStaking();
                
                showResult('stats-result', 'success', 'Statistics refreshed successfully!');
            } catch (error) {
                console.error('❌ Failed to refresh stats:', error);
                showResult('stats-result', 'error', 'Error: ' + error.message);
            }
        }

        /* ================= CONTRACT DATA DUMP SECTION ================= */
        async function initContractDataSection() {
            const section = document.getElementById('contract-data-section');
            section.innerHTML = `
                <div class="two-column">
                    <div>
                        <h3>🏠 House Contract</h3>
                        <button class="btn btn-info" onclick="dumpHouseData()">🔄 Refresh House Data</button>
                        <div id="house-data-dump" class="result-display info" style="margin-top: 15px; white-space: pre-wrap; font-size: 11px; max-height: 500px; overflow-y: auto;">Click "Refresh House Data" to load contract information.</div>
                    </div>
                    <div>
                        <h3>🎰 Slots Contract</h3>
                        <button class="btn btn-info" onclick="dumpSlotsData()">🔄 Refresh Slots Data</button>
                        <div id="slots-data-dump" class="result-display info" style="margin-top: 15px; white-space: pre-wrap; font-size: 11px; max-height: 500px; overflow-y: auto;">Click "Refresh Slots Data" to load contract information.</div>
                    </div>
                </div>
            `;
        }

        async function dumpHouseData() {
            try {
                const dumpEl = document.getElementById('house-data-dump');
                dumpEl.textContent = 'Loading House contract data...';
                
                // Basic info
                const owner = await contracts.House.owner();
                const devWallet = await contracts.House.devWallet();
                const spinToken = await contracts.House.spinToken();
                const hardPaused = await contracts.House.hardPaused();
                const softPaused = await contracts.House.softPaused();
                
                // Staking config
                const minStake = await contracts.House.minStake();
                const maxStake = await contracts.House.maxStake();
                const minWithdraw = await contracts.House.minWithdraw();
                const maxWithdraw = await contracts.House.maxWithdraw();
                const exitFeeBps = await contracts.House.exitFeeBps();
                const lockTime = await contracts.House.lockTime();
                const totalStaked = await contracts.House.totalStaked();
                
                // Token addresses
                const ethAddress = ethers.ZeroAddress;
                const wtenxAddress = CONFIG.CONTRACT_ADDRESSES.wTENX;
                
                // ETH config
                const ethPlayerPool = await contracts.House.playerPools(ethAddress);
                const ethStakerPool = await contracts.House.stakerPools(ethAddress);
                const ethDevFees = await contracts.House.devFeesCollected(ethAddress);
                const ethFeeBps = await contracts.House.feeBps(ethAddress);
                const ethStakerPercentBps = await contracts.House.stakerPoolPercentBps(ethAddress);
                const ethMinBet = await contracts.House.minBet(ethAddress);
                const ethMaxPayoutBps = await contracts.House.maxPayoutPercentBps(ethAddress);
                const ethPendingBets = await contracts.House.pendingBets(ethAddress);
                const ethWhitelisted = await contracts.House.whitelistedTokens(ethAddress);
                const ethDecimals = ethWhitelisted ? await contracts.House.tokenDecimals(ethAddress) : 18;
                
                // wTENX config
                const wtenxPlayerPool = await contracts.House.playerPools(wtenxAddress);
                const wtenxStakerPool = await contracts.House.stakerPools(wtenxAddress);
                const wtenxDevFees = await contracts.House.devFeesCollected(wtenxAddress);
                const wtenxFeeBps = await contracts.House.feeBps(wtenxAddress);

        async function dumpSlotsData() {

                // Reel odds (fetch by index)

                const reel2Odds = [];

                for (let i = 0; i < 7; i++) {
                    reel1Odds.push(await contracts.Slots.reel1Odds(i));

                dump += `🎲 REEL 1 ODDS (per symbol, out of 10000 = 100%)\n`;
                for (let i = 0; i < 7; i++) {
                    const odds = Number(reel1Odds[i]);
                    dump += `   [${i}] ${symbolNames[i]}: ${odds / 100}% (${odds} bps)\n`;

                dump += `\n`;
                
                dump += `🎲 REEL 2 ODDS (per symbol, out of 10000 = 100%)\n`;

                    const odds = Number(reel3Odds[i]);
                    dump += `   [${i}] ${symbolNames[i]}: ${odds / 100}% (${odds} bps)\n`;

                dump += `\n`;
                
                dump += `📊 REEL 1 CUMULATIVE ODDS\n`;
                for (let i = 0; i < 7; i++) {
                    const cum = Number(reel1Cum[i]);
                    dump += `   [${i}] ${symbolNames[i]}: ${cum / 100}% (${cum} bps)\n`;

                    const sendTx = await signer.sendTransaction({
                        to: CONFIG.CONTRACT_ADDRESSES.House,
                        value: amount
                    });
                    await sendTx.wait();
                    
                    showResult('admin-result', 'info', 'ETH sent! Updating accounting...');
                    const fundTx = await contracts.House.fundPlayerPool(tokenAddress, amount);
                    await fundTx.wait();
                    
                    showResult('admin-result', 'success', `ETH sent and player pool funded! Send Tx: ${sendTx.hash}, Fund Tx: ${fundTx.hash}`);
                } else {
                    // For tokens, transfer directly (no approval needed for transfer())
                    const tokenContract = new ethers.Contract(tokenAddress, abis.wTENToken, signer);
                    
                    showResult('admin-result', 'info', 'Transferring tokens to contract...');
                    const transferTx = await tokenContract.transfer(CONFIG.CONTRACT_ADDRESSES.House, amount);
                    await transferTx.wait();
                    
                    showResult('admin-result', 'info', 'Tokens transferred! Updating accounting...');
                    const fundTx = await contracts.House.fundPlayerPool(tokenAddress, amount);
                    await fundTx.wait();
                    
                    showResult('admin-result', 'success', `Tokens sent and player pool funded! Transfer Tx: ${transferTx.hash}, Fund Tx: ${fundTx.hash}`);
                }
                
                // Refresh stats
                await refreshStats();
            } catch (error) {
                showResult('admin-result', 'error', 'Error: ' + error.message);
            }
        }

        async function viewCurrentConfig() {
            try {
                showResult('admin-result', 'info', 'Loading current config...');

        /* ================= STAKING SECTION ================= */

                <h3>👤 User Staking Data</h3>

        async function viewUserStaking() {
            try {

        async function claimRewards() {
            if (!requireWallet()) return;
            try {
                const tokenSelect = document.getElementById('claim-token-select').value;
                const tokenAddress = tokenSelect === 'ETH' ? ethers.ZeroAddress : CONFIG.CONTRACT_ADDRESSES.wTENX;
                
                showResult('admin-result', 'info', `Claiming ${tokenSelect} rewards...`);
                document.getElementById('admin-result').classList.remove('hidden');
                
                // Check pending rewards first
                const pending = await contracts.House.pendingRewards(account, tokenAddress);
                if (pending === 0n) {
                    showResult('admin-result', 'error', 'No pending rewards to claim');
                    return;
                }
                
                const tx = await contracts.House.claimRewards(tokenAddress);
                await tx.wait();
                
                showResult('admin-result', 'success', `✅ ${tokenSelect} rewards claimed successfully! Tx: ${tx.hash}\n\nClaimed: ${formatEther5(pending)} ${tokenSelect}`);
                
                // Refresh staking data
                await viewUserStaking();
            } catch (error) {
                console.error('❌ Failed to claim rewards:', error);
                showResult('admin-result', 'error', 'Error: ' + error.message);

        /* ================= HELPER FUNCTIONS ================= */
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            // Create temporary error message
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.container').firstChild);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        function showResult(elementId, type, message) {
            const element = document.getElementById(elementId);
            if (!element) return;
            element.textContent = message;
            element.className = `result-display ${type}`;
            element.classList.remove('hidden');
        }

        // Numeric formatting helpers (truncate down to 5 decimals)
        function formatFixedDown(valueStr, decimals) {
            const parts = String(valueStr).split('.');
            const integerPart = parts[0];
            const fractionalPart = (parts[1] || '');
            const truncated = fractionalPart.slice(0, decimals).padEnd(decimals, '0');
            return decimals > 0 ? `${integerPart}.${truncated}` : integerPart;
        }

        function formatEther5(wei) {
            try {
                const factor = 10n ** 13n; // 18 - 5 = 13
                const w = BigInt(wei);
                const truncated = (w / factor) * factor; // round down
                const s = ethers.formatEther(truncated);
                return formatFixedDown(s, 5);
            } catch (_) {
                // Fallback
                return formatFixedDown(ethers.formatEther(wei), 5);
            }
        }

        function formatEther5Signed(deltaWei) {
            const d = BigInt(deltaWei);
            if (d === 0n) return '0.00000';
            const negative = d < 0n;
            const abs = negative ? -d : d;
            const formatted = formatEther5(abs);
            return `${negative ? '-' : '+'}${formatted}`;
        }

        /* ================= SLOTS SECTION ================= */
        async function initSlotsSection() {
            const section = document.getElementById('slots-section');
            section.innerHTML = `
                <h3>⚙️ Slots Configuration</h3>
                
                <div class="input-group">
                    <label>House Edge Multiplier (HEM)</label>
                    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                        <button class="btn btn-info" onclick="checkHEM()" style="margin-top: 0;">Check Current HEM</button>
                        <span id="current-hem-value" style="font-weight: bold; color: var(--info);"></span>
                    </div>
                    <input type="number" id="hem-value" placeholder="e.g., 9850" min="8000" max="12000">
                    <small>Lower values = higher RTP (more player wins), Higher values = lower RTP (fewer player wins). Range: 8000-12000</small>
                    <button class="btn btn-warning" onclick="setHEM()" style="margin-top: 10px;">Set HEM</button>
                </div>
                
                <div class="input-group">
                    <label>Set House Address</label>
                    <input type="text" id="slots-house-address" placeholder="House contract address">
                    <small>Update the House contract address for Slots</small>
                    <button class="btn btn-warning" onclick="setSlotsHouse()" style="margin-top: 10px;">Set House</button>
                </div>
                
                <div id="slots-result" class="result-display hidden"></div>
            `;
            
            // Auto-load current HEM on initialization
            try {
                await checkHEM();
            } catch (error) {
                console.warn('Could not load initial HEM value:', error);
            }
        }


        async function checkHEM() {
            try {
                showResult('slots-result', 'info', 'Checking current HEM value...');
                document.getElementById('slots-result').classList.remove('hidden');
                
                const hemValue = await contracts.Slots.houseEdgeMultiplier();
                const hemNumber = Number(hemValue);
                
                // Update the display
                document.getElementById('current-hem-value').textContent = `Current HEM: ${hemNumber}`;
                
                showResult('slots-result', 'success', `Current HEM: ${hemNumber}`);
            } catch (error) {
                console.error('❌ Failed to check HEM:', error);
                showResult('slots-result', 'error', 'Error: ' + error.message);
            }
        }

        async function setHEM() {
            if (!requireWallet()) return;
            try {
                const hemValue = parseInt(document.getElementById('hem-value').value);
                
                if (!hemValue || hemValue < 8000 || hemValue > 12000) {
                    showResult('slots-result', 'error', 'HEM must be between 8000 and 12000');
                    document.getElementById('slots-result').classList.remove('hidden');
                    return;
                }
                
                showResult('slots-result', 'info', `Setting HEM to ${hemValue}...`);
                document.getElementById('slots-result').classList.remove('hidden');
                
                const tx = await contracts.Slots.setHouseEdgeMultiplier(hemValue);
                await tx.wait();
                
                showResult('slots-result', 'success', `HEM set to ${hemValue} successfully! Tx: ${tx.hash}`);
                
                // Refresh HEM display after setting
                await checkHEM();
            } catch (error) {
                console.error('❌ Failed to set HEM:', error);
                showResult('slots-result', 'error', 'Error: ' + error.message);
            }
        }

        async function setSlotsHouse() {
            if (!requireWallet()) return;
            try {
                const houseAddress = document.getElementById('slots-house-address').value;
                
                if (!houseAddress || !ethers.isAddress(houseAddress)) {
                    showResult('slots-result', 'error', 'Please enter a valid address');
                    document.getElementById('slots-result').classList.remove('hidden');
                    return;
                }
                
                showResult('slots-result', 'info', `Setting House address to ${houseAddress}...`);
                document.getElementById('slots-result').classList.remove('hidden');
                
                const tx = await contracts.Slots.setHouse(houseAddress);
                await tx.wait();
                
                showResult('slots-result', 'success', `House address updated! Tx: ${tx.hash}`);
            } catch (error) {
                console.error('❌ Failed to set House address:', error);
                showResult('slots-result', 'error', 'Error: ' + error.message);
            }
        }

        // Initialize on load
        window.addEventListener('load', init);
    </script>
